# The ship gate. One command, the same one that runs locally before a commit,
# so CI is a second opinion rather than a different opinion.
#
# eval_build.py is deliberately absent: rebuilding the frozen set in CI would
# mean the expectations were produced by the code under test on the same run,
# which is the drift this whole arrangement exists to prevent.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install a browser
        # The rendered-page checks measure getComputedStyle on the running app.
        # They skip locally when no browser is present, which is why the next
        # step makes them mandatory here: a check that can skip is a check that
        # eventually only skips.
        run: python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the frontend, so the rendered checks have it to measure
        # THE APP THAT SHIPS IS NOW MEASURED IN A BROWSER TOO, and it cannot be
        # served without being built. The `web` job below builds it as well and
        # that duplication is deliberate: that job answers "does the frontend
        # compile", this step produces an artifact for the gate to open and
        # read `getComputedStyle` off. A skeleton pulsed on all six surfaces for
        # weeks because nothing did.
        #
        # The built server, never `next dev`: development mode mounts Next's own
        # overlay, which draws furniture no reader ever sees.
        run: npm ci && npm run build
        working-directory: web

      - name: Generate the working dataset
        # data/ is gitignored and regenerated from a documented seed. The eval
        # set under evals/ is NOT regenerated here; it is read as committed.
        run: python -m src.generate_data --seed 42

      - name: Ship gate
        # Blocks on a failing test, a PASSING xfail (xfail_strict), a manifest
        # mismatch, or a missed floor. Does not block on the snapshot moving.
        env:
          # Turns a missing browser, or a frontend nobody built, from a skip
          # into a failure. Locally either one skips and the gate prints every
          # skip reason; here both are present and both sets run.
          RENDER_CHECKS: required
        run: python eval_harness.py

  # THE FRONTEND'S OWN GATE, in the same workflow and as a separate job.
  #
  # Separate because it fails for different reasons and a mixed job makes "the
  # gate is red" ambiguous. Same workflow because a pull request that typechecks
  # the scoring library and ships a frontend that does not compile is not a
  # green pull request.
  #
  # The scoring floors are NOT measured here. Nothing in `web/` can move one:
  # every figure it draws is computed in Python and asserted there, which is the
  # arrangement that keeps a judgment out of the transport and out of the paint.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Typecheck
        # Separate from the build so a type error is reported as a type error.
        run: npm run typecheck
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
