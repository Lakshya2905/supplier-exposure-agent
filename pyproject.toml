[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-exposure-agent"
version = "0.1.0"
description = "Agent 3: which single points of failure in a BOM would actually stop production"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    # Pinned with a floor like the rest. Carries config/archetypes.yaml, which
    # holds the reviewer-owned magnitude thresholds.
    "pyyaml>=6.0",
    # The review interface. Pinned with a floor like the rest; the headless
    # AppTest harness that gates it lives in streamlit.testing.v1.
    "streamlit>=1.40",
    # Charts and the region choropleth on the Dashboard surface. Added when the
    # nominal-only encoding rule was retired on 2026-08-06; before that there
    # was nothing for a chart library to do. plotly.js carries its own world
    # geometry, so the map needs no network call at render time.
    "plotly>=5.20",
    # The scoring library over HTTP, so a frontend that is not Streamlit can
    # reach it. RUNTIME, not a dev extra: the backend container serves this and
    # nothing else, and a dependency the deployed process imports belongs in the
    # set the deployed process installs.
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Multipart parsing, which FastAPI does not carry itself. Required by the
    # upload path, so a deployment without it accepts a file and 500s.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # Serves the app to a real browser so the rendered page can be measured.
    # Four defects shipped that every source-reading test was happy with, which
    # is one failure four times: a declaration is not a painted pixel. Dev only:
    # a deployed container renders the app and never inspects it.
    "playwright>=1.44",
    # Starlette's TestClient transport. Dev only: the deployed process serves
    # requests and never issues them.
    "httpx2>=0.1",
]

# Pinned deliberately. setuptools sees a `src/` directory and switches to
# src-layout, which would install `synthetic` as the top-level package and make
# `python -m src.generate_data` work only because the repo root happens to be on
# sys.path. Both commands in CLAUDE.md are hard constraints, so the layout is
# stated rather than inferred. tests/test_cli.py proves the contract by running
# the literal command in a subprocess.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
