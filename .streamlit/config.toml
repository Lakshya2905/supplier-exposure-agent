# Dark. Colour distinguishes categories and never ranks them.
#
# The accent is used on interactive elements. Category colour lives in the
# stylesheet's chip palette, where every entry shares one saturation and one
# lightness and differs only in hue: no chip is darker, stronger or warmer than
# another, so no reading of the set produces an order.

[theme]
base = "dark"
primaryColor = "#7FB2D9"
backgroundColor = "#14171A"
secondaryBackgroundColor = "#1B1F23"
textColor = "#E3E6E8"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
