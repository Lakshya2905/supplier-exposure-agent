# Light, since 2026-08-07. Colour distinguishes categories and never ranks them.
#
# THE SUBSTRATE CHANGED, SO EVERY RATIO WAS RE-DERIVED RATHER THAN INVERTED.
# DESIGN.md said a light variant voids every guarantee in it until the numbers
# are measured again on that substrate, so each step of the text ramp was solved
# for the contrast its dark counterpart had, and none of them was picked by eye.
#
# The accent is used on interactive elements, and only on those.
#
# THE CHIP PALETTE THIS COMMENT USED TO DESCRIBE NO LONGER EXISTS. It claimed
# one saturation and one lightness per hue, and that claim was false: measured
# in CIELAB the entries spanned 15.3 L* points and sorted into a brightness ramp
# in declaration order. Hue is retired from the category palette entirely, and
# there is one neutral chip whose form carries the taxonomy. See DESIGN.md.
#
# `textColor` is the fallback for anything the stylesheet does not claim. It is
# text-primary, and Streamlit paints headings with it at a specificity element
# rules lose to, which is why h1 through h6 in review_app.py set their colour
# with !important.

[theme]
base = "light"
primaryColor = "#194F7D"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#EAEDF1"
textColor = "#222527"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true
