# Render Blueprint for the scoring API. Point Render at this repository and it
# reads this file; nothing here is typed into a dashboard, so what is deployed
# is in version control and reviewable.
#
# THE FRONTEND IS NOT HERE. It is on Vercel, from `web/`, and the two deploy
# separately on purpose: the frontend is what a link points at, the backend is
# what must not sleep, and those are different requirements.
services:
  - type: web
    name: supplier-exposure-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    # NOT THE FREE PLAN, AND THAT IS THE WHOLE POINT. Render spins a free web
    # service down after inactivity and takes tens of seconds to wake it. This
    # project moved off Streamlit Community Cloud for exactly that behaviour:
    # a sleeping backend is a dead link with extra steps.
    plan: starter

    envVars:
      # Generated by Render and never seen by anybody. The Vercel proxy needs
      # the same value: copy it from the dashboard into SEA_API_KEY there.
      - key: SEA_API_KEY
        generateValue: true
      # Both are written at request time and both must OUTLIVE A DEPLOY.
      - key: SEA_RUNS_DIR
        value: /data/runs
      - key: SEA_DECISIONS_DIR
        value: /data/decisions

    # A decision log that resets when a container restarts is the defect
    # `governance/store.py` was written to close, one layer out. Without this
    # disk, every deploy erases who decided what.
    disk:
      name: sea-data
      mountPath: /data
      sizeGB: 1
