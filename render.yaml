# Render Blueprint for the scoring API. Point Render at this repository and it
# reads this file; nothing here is typed into a dashboard, so what is deployed
# is in version control and reviewable.
#
# THE FRONTEND IS NOT HERE. It is on Vercel, from `web/`, and the two deploy
# separately on purpose: the frontend is what a link points at, the backend is
# what must not sleep, and those are different requirements.
services:
  - type: web
    name: supplier-exposure-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    # FREE, CHOSEN DELIBERATELY BY THE OWNER ON 2026-09-16, ON THE RECORD.
    #
    # This file used to pin `starter` and say the free tier was refused,
    # because a free service spins down after 15 minutes of inactivity and the
    # next visitor waits about a minute. That objection has not become wrong.
    # It was overruled: nobody is paying for this deployment, and a link that
    # is slow once beats a link that does not exist.
    #
    # WHAT DECIDED IT BETWEEN THE FREE OPTIONS, because it is not the obvious
    # axis. A sleeping service here WAKES ON THE REQUEST. Streamlit Community
    # Cloud answers a sleeping app with a static shell and makes the visitor
    # press a button to start it, and a stranger reads that as broken. Slow is
    # recoverable; asking the recipient to diagnose the link is not. Fly has no
    # free tier for new accounts as of 2026, and Docker Spaces on Hugging Face
    # now require a paid plan, so this was the only free option that auto-wakes.
    #
    # WHAT WAS GIVEN UP, stated plainly so nobody has to reconstruct it:
    #   1. About a minute on the first request after fifteen quiet minutes.
    #   2. The decision log does not survive a spin-down. See the note on
    #      SEA_DECISIONS_DIR below. This is the larger of the two and it is not
    #      a cosmetic loss.
    #
    # TO REVERSE IT: set `plan: starter` and uncomment the `disk:` block at the
    # foot of this file. That is the entire change; nothing in `src/` moves.
    plan: free

    envVars:
      # Generated by Render and never seen by anybody. The Vercel proxy needs
      # the same value: copy it from the dashboard into SEA_API_KEY there.
      - key: SEA_API_KEY
        generateValue: true

      # Both are written at request time, and ON THIS PLAN THEY DO NOT SURVIVE.
      # A free service has an ephemeral filesystem and cannot attach a disk, so
      # `/data` is an ordinary directory inside the container and a spin-down
      # empties it. A reviewer's sign-off outlives their coffee break and not
      # much more.
      #
      # THAT IS THE DEFECT `governance/store.py` WAS WRITTEN TO CLOSE, one
      # layer out, and the paid plan closed it. It is named here rather than
      # papered over: the code is unchanged and still correct, and it is the
      # host that stopped holding up its end. Anything this deployment is used
      # to demonstrate about the decision log has to be said in one sitting.
      #
      # The paths are left pointing at `/data` on purpose, so that restoring
      # the disk below is the only thing reversing this needs.
      - key: SEA_RUNS_DIR
        value: /data/runs
      - key: SEA_DECISIONS_DIR
        value: /data/decisions

    # RESTORE THIS WITH `plan: starter` ABOVE. A free service cannot attach a
    # disk at all, so this is not a setting that was tuned down; it is one the
    # plan makes unavailable.
    #
    # disk:
    #   name: sea-data
    #   mountPath: /data
    #   sizeGB: 1
